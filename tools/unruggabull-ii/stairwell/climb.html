<title>Stairwell Climb</title>
<style>
/* The picture on top, the thumb controls under it (stick left, Shoot over Slash right), then the section jumps. Dark, like the game. */
:root {
  --ground: #0d0b12; --panel: #17141f; --line: #2b2636; --ink: #ece6d8; --dim: #9a92a6; --gold: #ffd44a;
  --shoot: #2f86c8; --shoot-hi: #7fd4ff; --slash: #c8302a; --slash-hi: #ff8a70;
  --ui: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--ground); color: var(--ink); }
body { font: 15px/1.4 var(--ui); padding-block: 0 24px; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; display: grid; gap: 10px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 10px; }
h1 { font-size: 18px; margin: 0; }
h1 span { color: var(--gold); }
.stage { margin-inline: -16px; background: #000; position: relative; }
canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; }
@media (min-width: 792px) { .stage { margin-inline: 0; } }
.pad { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; min-height: 190px; }
#stick { position: relative; height: 190px; border-radius: 14px; background: radial-gradient(circle at 50% 50%, #1d1926 0, #120f18 70%); touch-action: none; display: grid; place-items: center; }
#knob { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #4a4258; background: #2a2434; transition: transform .05s; }
#knob.rest { transition: transform .15s; opacity: .7; }
#stick small { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; color: var(--dim); font-size: 12px; }
.btns { display: grid; gap: 14px; justify-items: center; }
.big { width: 82px; height: 82px; border-radius: 50%; border: 3px solid #000; font: 600 13px var(--ui); color: #fff; touch-action: none; cursor: pointer; letter-spacing: .06em; }
#shoot { background: var(--shoot); box-shadow: 0 5px 0 #154a73; }
#slash { background: var(--slash); box-shadow: 0 5px 0 #6e1712; }
.big.down { transform: translateY(4px); box-shadow: none; filter: brightness(1.3); }
button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; min-height: 40px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row span { color: var(--dim); font-size: 13px; }
#debug { font: 12px ui-monospace, monospace; color: var(--dim); }
#card[hidden] { display: none; }
#card { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; background: rgba(8, 6, 12, .55); }
#card p { margin: 0; color: var(--gold); text-shadow: 0 1px 0 #000; }
.note { color: var(--dim); font-size: 13px; margin: 0; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap">

<div class="wrap">
  <header><h1>Unruggabull II · <span>the stairwell, playable</span></h1><button id="mute" aria-pressed="false">Sound on</button></header>
  <div class="stage">
    <canvas id="c" width="480" height="270" aria-label="The stairwell"></canvas>
    <div id="card" hidden><p id="cardText"></p><button id="again">Play again</button></div>
  </div>
  <div class="pad">
    <div id="stick" aria-label="Move: slide left or right, flick up to jump, hold down to crouch"><div id="knob" class="rest"></div><small>slide to move · flick up to jump</small></div>
    <div class="btns"><button id="shoot" class="big">SHOOT</button><button id="slash" class="big">SLASH</button></div>
  </div>
  <div class="row"><span>Start from</span><button data-from="0">1 · G to 1</button><button data-from="1">2 · the Rugmergency</button><button data-from="2">3 · the door</button></div>
  <p class="note">Keys: A/D or arrows move, W/Up/Space jump, S/Down crouch, Shift or J shoot, Enter or K slash. The katana comes at the Rugmergency.</p>
  <div id="debug"></div>
</div>
