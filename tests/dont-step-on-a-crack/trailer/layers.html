<!doctype html><html><head><meta charset="utf-8">
<!-- The trailer's text layers, in the game's own fonts and chalk texture. tools/trailer/layers.py renders each
     <template> to a transparent 1920x1080 PNG; shots.py places and animates them. -->
<link rel="stylesheet" href="{{SITE}}assets/fonts/fonts.css">
<style>
:root{--chalk:#fbf8f1;--chalk-yellow:#f4e27a}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
#L{position:absolute;inset:0}
.chalk{font-family:"Schoolbell",cursive;color:var(--chalk);-webkit-mask-image:var(--chalk-mask);-webkit-mask-size:240px 240px;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.45)) drop-shadow(0 0 18px rgba(0,0,0,.55))}
/* the rhyme sits on the grass right of the sidewalk */
.cap{position:absolute;left:1296px;width:600px;font-size:80px;line-height:1.04;letter-spacing:.005em}
.y{color:var(--chalk-yellow)}
/* the opening title, lettered like the game's title screen (.t-title in index.html), on the grass right of the sidewalk */
.t-title{position:absolute;left:1258px;top:268px;margin:0;font-family:"Cabin Sketch","Schoolbell",cursive;font-weight:700;color:var(--chalk);line-height:.9;
  text-transform:uppercase;display:grid;justify-items:start}
.t-title>span{display:block}
.t-title .l1{font-size:106px}
.t-title .l2{font-size:77px;color:var(--chalk-yellow);margin-top:.12em}
.t-title .l3{position:relative;font-size:190px;color:var(--chalk-pink);transform:rotate(-3deg);transform-origin:0 60%;margin-top:.02em;padding-right:.1em}
.t-title svg{position:absolute;overflow:visible}
.t-title .scrib{left:.02em;right:.1em;bottom:-.1em;width:calc(100% - .12em);height:.2em}
.t-title .scrib path{fill:none;stroke:var(--chalk-pink);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.t-title .fissure{left:0;top:0;width:100%;height:100%}
.t-title .fissure path{fill:none;stroke:#1d1914;stroke-width:4;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.85}
:root{--chalk-pink:#f7a8c4}
/* end card: the studio mark and address on the game's dark panel style */
/* end card: the studio mark and address, big enough to read on a phone, on a dark shade so it never sinks into the art */
.shade{position:absolute;left:0;right:0;bottom:0;height:420px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.62))}
.pill{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);display:flex;align-items:center;gap:34px;white-space:nowrap;
  background:rgba(20,22,17,.94);color:#fff;border:6px solid #f4e27a;border-radius:999px;padding:18px 70px 18px 36px;box-shadow:0 14px 50px rgba(0,0,0,.6);
  font-family:"Atkinson Hyperlegible",sans-serif;font-weight:700;font-size:84px;letter-spacing:.005em}
.pill img{width:120px;height:132px;image-rendering:pixelated}
</style></head><body>
<div id="L"></div>

<template id="title"><h1 class="t-title chalk"><span class="l1">Don't step</span><span class="l2">on a</span><span class="l3">crack<svg class="fissure" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M4 30 L18 44 L15 52 L31 58 L36 70 L52 64 L60 78 L74 72 L83 86 L97 80"/></svg><svg class="scrib" viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M3 12 C 28 3, 52 19, 78 10 S 124 3, 150 12 S 184 17, 197 7"/></svg></span></h1></template>
<template id="cap1"><div class="cap chalk" style="top:318px">Step on a crack&hellip;</div></template>
<template id="cap2"><div class="cap chalk y" style="top:418px">&hellip;break your mother&rsquo;s back.</div></template>
<template id="pill"><div class="shade"></div><div class="pill"><img src="{{SITE}}assets/mark-pixel-dark.png" alt=""><span>jonniepeed.games</span></div></template>

<script>
// the same chalk texture as the game's title lettering (makeChalkMask in game.js), at a larger scale
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const n=240,c=document.createElement('canvas');c.width=c.height=n;const g=c.getContext('2d'),r=mulberry32(77);
g.fillStyle='#fff';g.fillRect(0,0,n,n);g.globalCompositeOperation='destination-out';
for(let i=0;i<2000;i++){g.fillStyle=`rgba(0,0,0,${(0.2+r()*0.7).toFixed(2)})`;const s=0.7+r()*2.2;g.fillRect(r()*n,r()*n,s,s*(0.6+r()));}
g.lineWidth=0.9;for(let i=0;i<60;i++){g.strokeStyle=`rgba(0,0,0,${(0.15+r()*0.3).toFixed(2)})`;const x=r()*n,y=r()*n;g.beginPath();g.moveTo(x,y);g.lineTo(x+(r()-0.5)*44,y+(r()-0.5)*8);g.stroke();}
document.documentElement.style.setProperty('--chalk-mask',`url(${c.toDataURL()})`);
</script>
</body></html>
