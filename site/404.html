<style>
/* Layout: small logo, message, the pixel JonniePeed washing away a pixel 404, a link home, then the studio footer */
:root{
  --bg:#ffffff;--ink:#17141f;--muted:#5f5973;--line:#e8e4f0;--card:#f7f5fb;--pink:#e3157f;
  --display:'Silkscreen',ui-monospace,monospace;--body:'Pixelify Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16131e;--ink:#f6f2ec;--muted:#aaa3bb;--line:#2d2839;--card:#1f1a2a;--pink:#ff4fa8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16131e;--ink:#f6f2ec;--muted:#aaa3bb;--line:#2d2839;--card:#1f1a2a;--pink:#ff4fa8;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
/* iPhones zoom on a quick double tap, even on buttons. Pinch zoom still works, and stricter rules (none, pan-y) still win. */
*{touch-action:manipulation}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:1fr auto;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:1000px;width:100%;margin:0 auto;padding-inline:16px}
main{display:grid;justify-items:center;align-content:center;gap:12px;padding-block:28px 40px;text-align:center}
.logo{display:block;border-radius:8px}
.logo img{display:block;width:min(56vw,200px);height:auto}
.logo:focus-visible{outline:3px solid var(--pink);outline-offset:4px}
.logo-dark{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-light{display:none!important}:root:not([data-theme="light"]) .logo-dark{display:block!important}}
:root[data-theme="dark"] .logo-light{display:none!important}
:root[data-theme="dark"] .logo-dark{display:block!important}
h1{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(22px,5vw,30px);line-height:1.2}
p{margin:0;color:var(--muted)}
.stage{width:100%;max-width:720px;margin-top:6px}
.stage canvas{display:block;margin:0 auto;image-rendering:pixelated;cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage canvas:focus-visible{outline:3px solid var(--pink);outline-offset:4px;border-radius:4px}
.note{font-size:15px;min-height:1.5em}
.home{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;padding:10px 18px;font:13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;background:var(--card);border:2px solid var(--line);border-radius:8px;transition:border-color .15s ease}
.home:hover{border-color:var(--pink)}
.home:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
footer{border-top:2px solid var(--line)}
footer .wrap{display:flex;align-items:center;gap:10px;padding-block:18px 24px;color:var(--muted);font-size:14px}
footer img{width:20px;height:22px;image-rendering:pixelated}
.mark-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mark-light{display:none}:root:not([data-theme="light"]) .mark-dark{display:block}}
:root[data-theme="dark"] .mark-light{display:none}
:root[data-theme="dark"] .mark-dark{display:block}
@media (prefers-reduced-motion:reduce){.home{transition:none}}

<body>
<main class="wrap">
  <a class="logo" href="/"><img class="logo-light" src="https://jonniepeed.games/assets/studio/logo.webp?v=90c7aa524d" width="900" height="722" alt="JonniePeed Games home"><img class="logo-dark" src="https://jonniepeed.games/assets/studio/logo-dark.webp?v=afcb87ba0c" width="900" height="722" alt="JonniePeed Games home"></a>
  <h1>Page not found</h1>
  <p>There's nothing at this address.</p>
  <div class="stage"><canvas id="scene" width="120" height="56" tabindex="0" role="img" aria-label="Pixel JonniePeed sending a rainbow at a pixel 404. Hold with a pointer, Space or Enter to build power and wash the 404 away."></canvas></div>
  <p class="note" id="note" aria-live="polite">Press and hold to wash the 404 away.</p>
  <a class="home" href="/">Back to the games</a>
</main>
<footer>
  <div class="wrap">
    <img class="mark-light" src="https://jonniepeed.games/assets/studio/mark-pixel.png?v=4c7026aca0" width="40" height="44" alt=""><img class="mark-dark" src="https://jonniepeed.games/assets/mark-pixel-dark.png?v=39bbd450b3" width="40" height="44" alt="">
    <span>© JonniePeed Games™</span>
  </div>
</footer>
<script>
// The homepage's pixel JonniePeed (assets/studio/ident.js), aimed at a pixel 404.
// Hold to build power: the arc reaches higher and farther, and knocks pixels off wherever it lands.
(function () {
  const cv = document.getElementById('scene');
  const note = document.getElementById('note');
  const g = cv.getContext('2d');
  const H = 56, GROUND = 52, LIFT = GROUND - 44;   // the figure is drawn for a floor at 44, then lifted
  const BANDS = ['#ec188c', '#ffcc00', '#1e9bf0'];
  const COLORS = ['#ec188c', '#ff7a14', '#ffcc00', '#5fbf1e', '#1e9bf0', '#8a2be2'];
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CHARGE_SECONDS = 1.4;
  const FOUR = ['...#.', '..##.', '.#.#.', '#..#.', '#####', '...#.', '...#.'];
  const ZERO = ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'];
  const TEXT = [FOUR, ZERO, FOUR];

  let W = 120, scale = 3, time = 0, last = 0, running = false, visible = true, frame = 0;
  let parts = [], stains = new Map(), power = 0, holding = false, input = null, splashT = 0;
  // the 404 is a pixel mask on the floor at the right; cell is the size of one font pixel
  let cell = 0, mask = null, mw = 0, mh = 0, mx = 0, my = 0, total = 0, left = 0, wear = 0, cleared = false;

  function build(c) {
    cell = c; mw = 17 * c; mh = 7 * c;
    mask = new Uint8Array(mw * mh); left = 0;
    TEXT.forEach((glyph, d) => glyph.forEach((row, r) => [...row].forEach((ch, col) => {
      if (ch !== '#') return;
      for (let j = 0; j < c; j++) for (let i = 0; i < c; i++) { mask[(r * c + j) * mw + (d * 6 + col) * c + i] = 1; left++; }
    })));
    total = left; wear = 0; cleared = false;
  }
  function solid(x, y) {
    const i = x - mx, j = y - my;
    return i >= 0 && j >= 0 && i < mw && j < mh && mask[j * mw + i] === 1;
  }

  function size() {
    const cw = cv.parentElement.clientWidth;
    scale = cw >= 600 ? 4 : 3;
    W = Math.max(80, Math.floor(cw / scale));
    cv.width = W; cv.height = H;
    cv.style.width = W * scale + 'px';
    cv.style.height = H * scale + 'px';
    const c = W >= 150 ? 3 : 2;
    if (c !== cell) build(c);
    mx = W - mw - 6; my = GROUND + 1 - mh;
    draw();
  }

  const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
  function line(x0, y0, x1, y1, c, t) {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2 || 1;
    for (let i = 0; i <= n; i++) { const u = i / n; R(x0 + (x1 - x0) * u, y0 + (y1 - y0) * u, t, t, c); }
  }
  function tokens() {
    const s = getComputedStyle(document.documentElement);
    return { ink: s.getPropertyValue('--ink').trim() || '#17141f', line: s.getPropertyValue('--line').trim() || '#e8e4f0' };
  }

  // idle rhythm: 7.5s flowing, 1.5s off. Holding keeps it flowing.
  function phase(t) {
    if (holding || power > 0.05) return { grow: 1, cut: 0, on: true };
    const c = t % 9;
    if (c < 0.4) return { grow: c / 0.4, cut: 0, on: false };
    if (c < 7.5) return { grow: 1, cut: 0, on: true };
    if (c < 8) return { grow: 1, cut: (c - 7.5) / 0.5, on: false };
    return { grow: 0, cut: 1, on: false };
  }

  function figure(fx, sway, ink) {
    const lean = Math.round(-power * 1.5), b = fx + sway;
    const hopY = splashT > 0 ? -1 : 0;
    g.save(); g.translate(0, LIFT);
    line(fx + 6, 33, fx + 1, 43, ink, 2);
    line(fx + 7, 33, fx + 11, 43, ink, 2);
    R(fx - 1, 43, 3, 2, ink); R(fx + 11, 43, 3, 2, ink);
    const t = b + lean;
    R(b + 5, 28 + hopY, 2, 6, ink); line(b + 5, 22 + hopY, b + 5 + lean * 0.5, 28 + hopY, ink, 2);
    line(t + 5, 24 + hopY, t + 1, 28 + hopY, ink, 1); line(t + 1, 28 + hopY, b + 5, 31 + hopY, ink, 1);
    line(t + 7, 24 + hopY, t + 11, 28 + hopY, ink, 1); line(t + 11, 28 + hopY, b + 7, 31 + hopY, ink, 1);
    for (let j = -4; j <= 4; j++) for (let i = -4; i <= 4; i++) if (i * i + j * j <= 18) R(t + 6 + i, 17 + j + hopY, 1, 1, ink);
    R(t + 3, 11 + hopY, 6, 2, ink); R(t + 2, 12 + hopY, 9, 3, ink); R(t + 10, 14 + hopY, 4, 1, ink); R(t + 5, 10 + hopY, 1, 1, ink);
    g.clearRect(t + 2, 15 + hopY, 9, 1);
    g.restore();
  }

  function draw() {
    const { ink, line: ground } = tokens();
    g.clearRect(0, 0, W, H);
    R(0, GROUND + 1, W, 1, ground);
    for (const [x, s] of stains) { g.globalAlpha = Math.min(1, s.life / 2); R(x, GROUND, 1, 1, s.c || ink); if (s.big) R(x, GROUND - 1, 1, 1, s.c || ink); }
    g.globalAlpha = 1;
    g.fillStyle = ink;
    for (let j = 0; j < mh; j++) for (let i = 0; i < mw; i++) if (mask[j * mw + i]) g.fillRect(mx + i, my + j, 1, 1);

    const fx = 6, sway = calm ? 0 : Math.round(Math.sin(time * 2.2) * 0.6);
    const ph = calm ? { grow: 1, cut: 0, on: true } : phase(time);
    const ox = fx + 9 + sway, oy = GROUND - 13;
    const room = W - ox - 6;
    // resting reach stays short of the 404; holding carries it all the way across
    const base = Math.min(room, 150) * (0.2 + 0.18 * (0.5 + 0.5 * Math.sin(time * 0.8)));
    const reach = base + (room - base) * power;
    const peak = 8 + 2 * Math.sin(time * 1.3) + power * 22;
    const n = Math.ceil(reach * 1.6);
    let tx = ox + reach, hit = null;
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      if (u > ph.grow) break;
      const x = ox + reach * u, y = oy + (GROUND - oy) * u - peak * 4 * u * (1 - u);
      const px = Math.round(x), py = Math.round(y);
      for (const dy of [0, 1, -1]) if (solid(px, py + dy)) { hit = { x: px, y: py + dy }; break; }
      if (hit) { tx = x; break; }
      if (u < ph.cut) continue;
      const glint = ((i - Math.floor(time * (60 + power * 60))) % 24 + 24) % 24 === 0;
      R(x, y - 1, 1, 1, glint ? '#ffffff' : BANDS[0]);
      R(x, y, 1, 1, BANDS[1]);
      R(x, y + 1, 1, 1, BANDS[2]);
      if (power > 0.6) R(x, y + 2, 1, 1, BANDS[2]);
    }
    figure(fx, sway, ink);
    for (const p of parts) R(p.x, p.y, 1, 1, p.c || ink);
    return { tx, hit, on: ph.on };
  }

  function burst(x, y, n, force, back) {
    for (let i = 0; i < n; i++) parts.push({ x, y, vx: (back ? -Math.random() : Math.random() - 0.4) * 40 * force, vy: -(12 + Math.random() * 30) * force, c: COLORS[(Math.random() * 6) | 0] });
  }

  // knock one pixel off the 404 at or next to where the stream lands
  function chip(x, y) {
    let pick = solid(x, y) ? [x, y] : null;
    for (let j = -1; j <= 1 && !pick; j++) for (let i = 0; i <= 2 && !pick; i++) if (solid(x + i, y + j)) pick = [x + i, y + j];
    if (!pick) return false;
    mask[(pick[1] - my) * mw + (pick[0] - mx)] = 0; left--;
    if (!calm) parts.push({ x: pick[0], y: pick[1], vx: 8 + Math.random() * 30, vy: -(6 + Math.random() * 24), c: null });
    return true;
  }
  // anything no longer joined to the floor (including corners) falls off
  function collapse() {
    const keep = new Uint8Array(mw * mh), stack = [];
    for (let i = 0; i < mw; i++) { const k = (mh - 1) * mw + i; if (mask[k]) { keep[k] = 1; stack.push(k); } }
    while (stack.length) {
      const k = stack.pop(), x = k % mw, y = (k / mw) | 0;
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
        const nx = x + i, ny = y + j, n = ny * mw + nx;
        if (nx >= 0 && ny >= 0 && nx < mw && ny < mh && mask[n] && !keep[n]) { keep[n] = 1; stack.push(n); }
      }
    }
    for (let k = 0; k < mask.length; k++) if (mask[k] && !keep[k]) {
      mask[k] = 0; left--;
      if (!calm) parts.push({ x: mx + k % mw, y: my + ((k / mw) | 0), vx: (Math.random() - 0.5) * 8, vy: 0, c: null });
    }
  }
  // the last few loose pixels crumble on their own
  function wipe() {
    for (let j = 0; j < mh; j++) for (let i = 0; i < mw; i++) if (mask[j * mw + i]) {
      mask[j * mw + i] = 0;
      if (!calm) parts.push({ x: mx + i, y: my + j, vx: (Math.random() - 0.3) * 30, vy: -Math.random() * 20, c: null });
    }
    left = 0; cleared = true;
    if (!calm) { burst(mx + mw / 2, GROUND - 1, 60, 1.6); splashT = 0.25; }
    note.textContent = 'All clean. Still nothing here, though.';
  }

  function tick(now) {
    if (!running) return;
    frame = 0;
    const elapsed = Math.max(0, (now - last) / 1000 || 0);
    const dt = Math.min(0.05, elapsed); last = now;
    if (!calm) time += dt;
    if (holding && !document.hidden) power = Math.min(1, power + elapsed / CHARGE_SECONDS);
    else power = Math.max(0, power - dt * 1.6);
    if (calm && !holding) { power = 0; draw(); stop(); return; }
    splashT = Math.max(0, splashT - dt);
    const { tx, hit, on } = draw();
    if (hit && on) {
      wear += dt * (20 + power * 50);
      let chipped = false;
      while (wear >= 1) { wear--; if (chip(hit.x, hit.y)) chipped = true; else { wear = 0; break; } }
      if (chipped) { collapse(); if (left <= total * 0.03) wipe(); }
      if (!calm && Math.random() < dt * 50) burst(hit.x - 1, hit.y, 1, 0.6 + power * 0.5, true);
    } else if (on && !calm && Math.random() < dt * (45 + power * 60)) burst(tx, GROUND - 1, 1, 1 + power * 0.6);
    for (const p of parts) { p.vy += 140 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    parts = parts.filter(p => {
      if (p.y < GROUND) return p.x > -2 && p.x < W + 2;
      const x = Math.round(p.x);
      if (x >= 0 && x < W && Math.random() < 0.5) { const s = stains.get(x); stains.set(x, { c: p.c, life: 5, big: !!s }); }
      return false;
    });
    for (const [x, s] of stains) { s.life -= dt; if (s.life <= 0) stains.delete(x); }
    frame = requestAnimationFrame(tick);
  }
  function start() { if ((calm && !holding) || running || !visible || document.hidden) return; running = true; last = performance.now(); frame = requestAnimationFrame(tick); }
  function stop() { running = false; cancelAnimationFrame(frame); frame = 0; }

  function press(source) {
    if (holding || document.hidden) return;
    holding = true; input = source;
    last = performance.now();
    start();
  }
  function release() {
    if (!holding) return;
    holding = false; input = null;
  }
  cv.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !e.isPrimary || holding) return;
    e.preventDefault();
    cv.focus({ preventScroll: true, focusVisible: false });
    press(e.pointerId);
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  const pointerRelease = e => { if (input === e.pointerId) release(); };
  cv.addEventListener('pointerup', pointerRelease);
  cv.addEventListener('pointercancel', pointerRelease);
  cv.addEventListener('lostpointercapture', pointerRelease);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!e.repeat) press(e.key); }
  });
  cv.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (input === e.key) release(); } });
  cv.addEventListener('blur', release);
  window.addEventListener('blur', release);

  new ResizeObserver(size).observe(cv.parentElement);
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible) start(); else { release(); stop(); } }).observe(cv);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { release(); stop(); } else start(); });
  size(); start();
})();
</script>
