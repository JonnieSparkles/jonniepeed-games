<style>
/* Layout: one centered column; back link, title, the 4:3 scene, a short caption */
:root{--dusk:#2a2140;--dusk-2:#3b2f58;--cream:#f6e7c8;--muted:#b6a6cc;--sun:#f5c32c;--display:'Silkscreen',ui-monospace,monospace;--body:'Pixelify Sans',system-ui,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}

html,body{background:var(--dusk);color:var(--cream)}
body{margin:0;font-family:var(--body);font-size:16px}
main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 28px;display:grid;gap:14px}
.back{justify-self:start;display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.back img{width:20px;height:22px;image-rendering:pixelated}
.back:hover,.back:focus-visible{color:var(--cream)}
.back:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--sun);letter-spacing:.02em}
.stage{border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px var(--dusk-2)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.5;max-width:60ch}

<body>
<main>
  <a class="back" href="../index.html"><img src="../assets/mark-pixel-dark.png" alt="" width="40" height="44">Jonniepeed Games</a>
  <h1>Windowsill</h1>
  <div class="stage"><canvas id="c" width="96" height="72" role="img" aria-label="A tiny explorer with a thimble backpack stands on a windowsill garden at sunset, beside a sunflower, a succulent and a trailing vine, while clouds drift by and a ladybug walks along the sill"></canvas></div>
  <p>A tiny explorer with a thimble for a backpack, holding a sunflower seed, on a windowsill at sunset. The scene that came before Thimbleful.</p>
</main>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const R=(a,b,w,h,k)=>{g.fillStyle=k;g.fillRect(Math.round(a),Math.round(b),w,h)};
const P=(a,b,k)=>R(a,b,1,1,k);
function disc(cx,cy,r,k){for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++)if(i*i+j*j<=r*r+r*0.6)P(cx+i,cy+j,k)}
const sky=[[5,'#46569a'],[12,'#6767ab'],[18,'#9676b2'],[24,'#cf8ca6'],[30,'#eea78b'],[36,'#f7c88c']];
const far=[[9,8,6],[17,6,9],[23,10,5],[33,7,8],[40,9,4],[49,6,10],[55,11,6],[66,8,7],[74,6,9],[80,7,5]];
const near=[[9,12,3],[24,9,4],[38,14,2],[57,10,3],[72,15,3]];
const lit=[[19,39],[35,40],[51,38],[68,41],[76,39]];
const clouds=[[0,9,2.2],[40,15,1.4],[70,7,1.8]];
function cloud(a,b){R(a,b,12,2,'#fde6e3');R(a+3,b-2,6,2,'#fde6e3');R(a+1,b+2,10,1,'#e8b8c8')}
function pot(x,y,w,h){R(x-1,y+1,w+2,3,'#c8643c');R(x-1,y+1,w+2,1,'#e08a5c');R(x,y,w,1,'#3d2a1c');R(x,y+4,w,h-4,'#b0532f');R(x+w-2,y+4,2,h-4,'#8e4024');R(x+1,y+5,1,h-6,'#c8643c')}
function leaf(x,y,dir){R(x,y,4*dir,2,'#5fa646');R(x+(dir>0?4:-5),y,1,1,'#5fa646');R(x,y+1,3*dir,1,'#4b8a37')}
function draw(t){
R(0,0,96,72,'#e7d6b8');
for(let j=2;j<72;j+=6)for(let i=(j%12?0:3);i<96;i+=6)P(i,j,'#dcc8a6');
R(6,2,84,46,'#8a5a3b');R(8,4,80,43,'#b57b52');
g.save();g.beginPath();g.rect(9,5,78,41);g.clip();
for(let s=0;s<sky.length;s++){const y0=sky[s][0],y1=s<sky.length-1?sky[s+1][0]:46;R(9,y0,78,y1-y0,sky[s][1]);if(s>0)for(let i=9;i<87;i+=2)P(i,y0-1,sky[s][1])}
disc(64,37,6,'#ffe0a0');disc(64,37,5,'#fff0c2');
for(const[x0,y,sp]of clouds){const a=9+((x0+t*sp)%100)-14;cloud(a,y)}
for(const[bx,bw,bh]of far)R(bx,46-bh,bw,bh,'#6e5788');
R(19,35,1,3,'#6e5788');R(52,33,2,3,'#6e5788');
for(const[lx,ly]of lit)P(lx,ly,(Math.floor(t*0.7+lx)%5)?'#ffd98a':'#6e5788');
for(const[bx,bw,bh]of near)R(bx,46-bh,bw,bh,'#4f3f68');
for(let i=0;i<10;i++){const mx=12+((i*29+t*1.2*(1+i%3))%72),my=8+((i*17)%30)+Math.sin(t*0.8+i)*2;P(mx,my,'rgba(255,246,216,0.75)')}
g.restore();
R(47,5,2,41,'#b57b52');R(49,5,1,41,'#8a5a3b');R(9,24,78,2,'#b57b52');R(9,26,78,1,'#8a5a3b');
R(4,46,88,5,'#d4a06c');R(4,46,88,1,'#ecc08a');R(2,51,92,4,'#a8703f');R(2,51,92,1,'#c48a55');R(4,55,88,1,'#cbb593');
const sw=Math.sin(t*1.2),off=y=>Math.round(sw*(36-y)/22*1.6);
for(let y=36;y>=14;y--){R(18+off(y),y,2,1,'#4f8f3a');P(18+off(y),y,'#67a84c')}
leaf(17+off(30),30,-1);leaf(20+off(24),24,1);leaf(17+off(19),19,-1);
const fx=18+off(14),fy=11;
for(let k=0;k<8;k++){const a=k*Math.PI/4;P(Math.round(fx+Math.cos(a)*5),Math.round(fy+Math.sin(a)*5),'#e0a01c')}
disc(fx,fy,4,'#f5c32c');disc(fx,fy,2,'#6b3f1f');P(fx-1,fy-1,'#4a2a14');P(fx+1,fy,'#4a2a14');P(fx,fy+1,'#8a5a2c');
pot(12,37,13,13);
R(56,40,7,3,'#7fb89a');R(57,38,5,2,'#93c9ab');P(59,37,'#a8d8bd');P(56,40,'#c97b8a');P(62,40,'#c97b8a');P(58,38,'#c97b8a');
pot(55,43,9,7);
const vs=Math.sin(t*0.9+1);
for(let y=41;y<=63;y++){const vx=72-Math.round((y-41)/9)+Math.round(vs*(y-41)/22*1.5);P(vx,y,'#3f7d3a');if((y-41)%4===0){const s=((y-41)/4)%2?1:-2;R(vx+s,y,2,2,'#4e9a4e');P(vx+s,y,'#6cbf5f')}}
for(let y=41;y<=58;y++){const vx=86+Math.round((y-41)/12)+Math.round(vs*(y-41)/17);P(vx,y,'#3f7d3a');if((y-41)%5===2){R(vx+1,y,2,2,'#4e9a4e');P(vx+1,y,'#6cbf5f')}}
pot(73,39,12,11);
R(73,36,4,3,'#4e9a4e');R(77,35,4,3,'#5aab55');R(81,36,4,3,'#4e9a4e');P(74,36,'#6cbf5f');P(78,35,'#6cbf5f');P(82,36,'#6cbf5f');
disc(46,46,3,'#3a5c9e');disc(46,46,2,'#4f78c4');P(45,45,'#2a3f6e');P(47,45,'#2a3f6e');P(45,47,'#2a3f6e');P(47,47,'#2a3f6e');
R(30,46,3,3,'#b8bcc4');R(31,45,2,1,'#b8bcc4');P(30,47,'#8d929c');P(32,46,'#8d929c');P(31,48,'#8d929c');
R(33,46,6,3,'#d9733b');R(34,49,1,2,'#3a3550');R(37,49,1,2,'#3a3550');
R(34,42,4,1,'#3f8f5a');R(33,43,6,3,'#3f8f5a');P(37,41,'#3f8f5a');R(35,44,3,2,'#f2c9a0');
const blink=(t%4)<0.15;P(35,44,blink?'#f2c9a0':'#2a1f1a');P(37,44,blink?'#f2c9a0':'#2a1f1a');
R(39,46,1,2,'#d9733b');P(39,45,'#f2c9a0');R(39,42,2,3,'#3b2c22');P(39,43,'#e6dccb');
const per=24,ph=(t%per)/per,dir=ph<0.5?1:-1,lx=Math.round(8+(ph<0.5?ph*2:2-ph*2)*76);
R(lx,52,3,2,'#d23a2a');P(lx+1,52,'#1e1a1a');P(dir>0?lx+3:lx-1,53,'#1e1a1a');P(lx+((Math.floor(t*6)%2)?0:2),54,'#1e1a1a');
}
if(calm){draw(2)}else{
let last=-1;
function loop(n){const f=Math.floor(n/83);if(f!==last){last=f;draw(n/1000)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
}
</script>
