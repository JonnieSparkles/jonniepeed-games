<style>
*{touch-action:manipulation}
:root{--bg:#0b0d14;--ink:#e8ecff;--dim:#8a93b8;--you:#39e1ff;--them:#ff8a3d;--card:#151a29;--line:#262e48}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 'Atkinson Hyperlegible',system-ui,sans-serif;overflow:hidden}
#game{position:fixed;inset:0;background:var(--bg)}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;pointer-events:none;font-size:14px;color:var(--dim)}
.hud.top{top:0;padding-top:max(12px,env(safe-area-inset-top))}
.hud.bottom{bottom:0;padding-bottom:max(12px,env(safe-area-inset-bottom));justify-content:center}
.hud a,.hud button{pointer-events:auto}
.who{display:flex;gap:14px;align-items:center}
.who span{display:inline-flex;align-items:center;gap:6px}
.who i{width:10px;height:10px;border-radius:50%;display:inline-block}
.who .me i{background:var(--you);box-shadow:0 0 8px var(--you)}
.who .fr i{background:var(--them);box-shadow:0 0 8px var(--them)}
.who .fr.away{opacity:.35}
.tools{display:flex;gap:6px;align-items:center}
.tools button,.hud a{font:inherit;color:var(--dim);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;text-decoration:none}
.tools button[aria-pressed="true"]{color:var(--ink)}
#hint{font-family:'Silkscreen',monospace;font-size:13px;letter-spacing:.04em;color:var(--dim);text-align:center}
#banner{position:absolute;left:0;right:0;top:13%;text-align:center;pointer-events:none;font-family:'Silkscreen',monospace;font-size:clamp(28px,8vw,56px);line-height:1.1;color:#fff;text-shadow:0 0 18px var(--you),0 0 36px var(--them);opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;padding:0 16px}
#banner.show{opacity:1;transform:scale(1)}
#banner small{display:block;font-family:'Atkinson Hyperlegible',sans-serif;font-size:16px;text-shadow:none;color:var(--ink);margin-top:10px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(11,13,20,.72)}
.overlay[hidden]{display:none}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px;text-align:center;max-height:100%;overflow:auto;touch-action:pan-y}
.card h1{font-family:'Silkscreen',monospace;font-weight:400;font-size:34px;line-height:1.1;margin-bottom:12px}
.card h2{font-family:'Silkscreen',monospace;font-weight:400;font-size:22px;line-height:1.2;margin-bottom:10px}
.card p{color:var(--dim);margin-bottom:16px}
.card .big{display:block;width:100%;font:700 18px 'Atkinson Hyperlegible',sans-serif;color:#061018;background:var(--you);border:0;border-radius:12px;padding:14px;cursor:pointer;margin-top:8px}
.card .ghost{display:block;width:100%;font:700 16px 'Atkinson Hyperlegible',sans-serif;color:var(--ink);background:none;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;margin-top:8px}
.card .back{display:inline-block;margin-top:16px;color:var(--dim);font-size:14px}
.link{width:100%;font:600 13px 'IBM Plex Mono',monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
#secretText.nope{color:var(--them)}
.card.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.wait{margin-top:16px;color:var(--them);font-size:15px}
.wait::after{content:'';animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@media (prefers-reduced-motion:reduce){#banner{transition:none}.card.shake{animation:none}.wait::after{animation:none;content:'...'}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c" aria-label="The play area. Drag to move your dot."></canvas>
  <div class="hud top">
    <div class="who"><span class="me"><i></i>You</span><span class="fr away" id="frLabel"><i></i>Friend</span></div>
    <div class="tools"><span id="ping"></span><button id="snd" type="button" aria-pressed="true">Sound</button><button id="fs" type="button" aria-pressed="false">Full screen</button></div>
  </div>
  <div id="banner" role="status" aria-live="polite"></div>
  <div class="hud bottom"><div id="hint"></div></div>

  <div class="overlay" id="titleCard">
    <div class="card">
      <h1>Don't click this.</h1>
      <p>Okay, you clicked it. This one takes two people, on two phones, anywhere in the world.</p>
      <button class="big" id="startBtn" type="button">Start a match</button>
      <a class="back" href="../">← Games</a>
    </div>
  </div>

  <div class="overlay" id="secretCard" hidden>
    <div class="card">
      <h2>What's the secret?</h2>
      <p id="secretText">Pick one.</p>
      <div id="choices"></div>
      <a class="back" href="../">← Games</a>
    </div>
  </div>

  <div class="overlay" id="shareCard" hidden>
    <div class="card">
      <h2 id="shareTitle">Send this to a friend</h2>
      <p>When they open it, you'll see each other here.</p>
      <input class="link" id="link" readonly aria-label="Match link">
      <button class="big" id="shareBtn" type="button">Send link</button>
      <button class="ghost" id="copyBtn" type="button">Copy link</button>
      <div class="wait" id="waitText">Waiting for your friend</div>
    </div>
  </div>

  <div class="overlay" id="msgCard" hidden>
    <div class="card">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button class="big" id="msgBtn" type="button">Start your own match</button>
      <a class="back" href="../">← Games</a>
    </div>
  </div>
</div>
<script src="audio.js?v=c699360794"></script>
<script src="game.js?v=9ab3f3e7f1"></script>
</body>
</html>
