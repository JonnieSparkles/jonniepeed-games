<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: one centered column; HUD row, 4:3 pixel stage, start card, hint. Full screen: HUD bar on top, stage fitted to the rest, card floats at the bottom */
:root{--dusk:#2a2140;--dusk-2:#3b2f58;--cream:#f6e7c8;--muted:#b6a6cc;--sun:#f5c32c;--sun-deep:#b8861a;--drop:#7fd0ff;--display:'Silkscreen',ui-monospace,monospace;--body:'Pixelify Sans',system-ui,sans-serif;color-scheme:dark}
html,body{background:var(--dusk);color:var(--cream)}
body{font-family:var(--body);font-size:16px}
main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 28px;display:grid;gap:14px}
.back{justify-self:start;display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.back img{width:20px;height:22px;image-rendering:pixelated}
.back:hover,.back:focus-visible{color:var(--cream)}
.back:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--sun);letter-spacing:.02em}
.hud{display:flex;flex-wrap:wrap;align-items:end;gap:18px}
.stat{display:grid;gap:2px}
.stat span{font-family:var(--display);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stat b{font-weight:600;font-size:20px;line-height:24px;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:4px;height:24px;align-items:center}
.pips i{width:8px;height:10px;background:var(--drop);display:block}
.pips i.gone{background:var(--dusk-2)}
.game{display:grid;gap:14px}
.stage{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px var(--dusk-2);width:min(100%,max(300px,calc((100svh - 150px) * 4 / 3)));margin-inline:auto;aspect-ratio:4/3}
.tool{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--cream);box-shadow:none;border:2px solid var(--dusk-2);padding:8px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.tool:active{transform:none;box-shadow:none}
.fs-ico{display:block;width:10px;height:10px;border:2px solid var(--cream)}
.full .fs-ico{border-style:dashed}
body.locked{overflow:hidden}
.game.full{position:fixed;inset:0;z-index:10;background:var(--dusk);grid-template-rows:auto minmax(0,1fr);gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 12px)}
.game.full header{gap:8px 14px}
.game.full h1{font-size:16px}
.game.full .hud{gap:12px}
.game.full .stat b{font-size:16px;line-height:20px}
.game.full .tool{padding:6px 10px}
.full .arena{container-type:size;display:grid;place-items:center;min-height:0}
.full .arena{position:relative;touch-action:none}
@media (orientation:portrait){.full.playing .arena::after{content:"Drag anywhere here to move";position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);pointer-events:none}}
.full .stage{width:min(100cqw,calc(100cqh * 4 / 3));max-width:none}
.full .overlay{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:grid;place-items:center;padding-inline:12px;pointer-events:none}
.full .card{pointer-events:auto;width:min(100%,460px);background:rgba(59,47,88,.95);padding:12px 14px 14px;gap:8px}
.full .card h2{font-size:16px}
.full .card p{font-size:14px}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:ew-resize}
.overlay{display:grid;text-align:center}
.card{display:grid;gap:10px;justify-items:center;background:var(--dusk-2);border-radius:10px;padding:16px 18px 18px}
.card p{max-width:44ch}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.ghost{background:transparent;color:var(--cream);box-shadow:none;border:2px solid var(--cream)}
.ghost:active{transform:none;box-shadow:none}
.link{background:none;box-shadow:none;padding:4px 6px;color:var(--muted);font-family:var(--body);font-size:14px;letter-spacing:0;text-transform:none;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--cream)}
.link:active{transform:none;box-shadow:none}
.corner{position:absolute;top:8px;right:8px;font-size:11px;padding:6px 10px;background:rgba(42,33,64,.85);color:var(--cream);box-shadow:none;border:2px solid var(--dusk-2)}
.corner:active{transform:none;box-shadow:none}
.watching .hud .stat{visibility:hidden}
.watching canvas{cursor:default}
.card h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;color:var(--sun);text-wrap:balance}
.card p{margin:0;line-height:1.4;color:var(--cream)}
button{font-family:var(--display);font-size:14px;background:var(--sun);color:var(--dusk);border:0;border-radius:4px;padding:10px 18px;box-shadow:0 3px 0 var(--sun-deep);cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun-deep)}
button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.hint{margin:0;color:var(--muted);font-size:14px}
.snd i{display:block;width:8px;height:8px;background:var(--drop)}
.snd[aria-pressed="false"] i{background:var(--dusk-2)}

/* Arcade board, styled for this game's end screen.
   Top 10 shows in full; "See all" scrolls inside the card. While the initials picker is open,
   the card's own buttons hide (.lb-entering) so there's one decision at a time. */
#board{width:100%;max-width:340px;min-width:0;display:grid;gap:8px;justify-items:center;margin:2px auto 8px}
#board h3{font-family:var(--display);font-weight:400;font-size:16px;margin:0;color:var(--sun);letter-spacing:.04em}
#board .lb-message{font-size:14px;margin:0}
.lb-entry{display:grid;gap:12px;justify-items:center}
.lb-slots{display:flex;justify-content:center;gap:10px}
.lb-slot{display:grid;gap:3px;justify-items:center}
#board .lb-button{font:inherit;font-size:12px;border:1px solid var(--muted);border-radius:5px;background:var(--dusk);color:var(--cream);padding:0;width:48px;min-height:36px;cursor:pointer;box-shadow:none}
#board .lb-letter{font-family:var(--display);font-size:24px;min-height:48px}
#board .lb-current .lb-letter{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun)}
.lb-actions{display:flex;justify-content:center;align-items:center;gap:14px}
#board .lb-ok{width:auto;min-height:44px;padding:10px 26px;font-family:var(--display);font-size:14px;background:var(--sun);color:var(--dusk);border:0;box-shadow:0 3px 0 var(--sun-deep)}
#board .lb-skip{width:auto;min-height:44px;padding:0 8px;font-family:var(--body);font-size:14px;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
#board .lb-button:not(.lb-ok):active,#board .lb-more:active{transform:none}
.lb-entering>.btns,.lb-entering>#introBtn{display:none!important}
.lb-list{width:100%}
.lb-list.lb-all{max-height:min(280px,42dvh);overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
.lb-table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.lb-table th{font-family:var(--display);font-size:10px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 6px 4px}
.lb-table td{padding:3px 6px;text-align:right}
.lb-table td:first-child,.lb-table th:first-child{width:2.6em;color:var(--muted)}
.lb-table td:nth-child(2),.lb-table th:nth-child(2){text-align:left;font-family:var(--display);font-size:14px;letter-spacing:.08em}
.lb-table td:last-child,.lb-table th:last-child{width:30px;text-align:center}
.lb-all thead th{position:sticky;top:0;background:var(--dusk-2)}
.lb-table .lb-you td{background:#63512b;color:var(--cream)}
.lb-table .lb-you td:first-child{color:var(--sun);border-radius:4px 0 0 4px}
.lb-table .lb-you td:last-child{border-radius:0 4px 4px 0}
.lb-gap td{text-align:center;color:var(--muted);padding:0;line-height:1}
.lb-input{width:16px;height:16px;vertical-align:middle;color:var(--muted)}
.lb-you .lb-input{color:var(--cream)}
#board .lb-more{min-height:32px;padding:4px 8px;font-family:var(--body);font-size:14px;background:none;border:0;box-shadow:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
#board .lb-more:hover{color:var(--cream)}
.lb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#board button:focus-visible,.lb-list:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#board button:disabled{opacity:.6;cursor:wait}
.card p{text-wrap:pretty}

.full .card{max-height:calc(100dvh - 100px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
</style>
</head>
<body>
<main>
  <a class="back" href="../index.html"><img src="../assets/mark-pixel-dark.png?v=39bbd450b3" alt="" width="40" height="44">JonniePeed Games</a>
  <section class="game" id="game" aria-label="Thimbleful">
  <header>
    <h1>Thimbleful</h1>
    <div class="hud">
      <div class="stat"><span>Caught</span><b id="score">0</b></div>
      <div class="stat"><span>Chances</span><div class="pips" id="pips"></div></div>
      <div class="stat"><span>Best</span><b id="best">0</b></div>
      <button class="tool snd" id="snd" type="button" aria-pressed="true"><i aria-hidden="true"></i><span>Sound on</span></button>
      <button class="tool" id="fs" type="button"><i class="fs-ico" aria-hidden="true"></i><span>Full screen</span></button>
    </div>
  </header>
  <div class="arena">
  <div class="stage">
    <canvas id="c" width="96" height="72" aria-label="A tiny explorer on a windowsill garden at sunset catches drips from a leaking watering can in her thimble"></canvas>
    <button id="skip" class="corner" type="button" hidden>Skip</button>
    <button id="leave" class="corner" type="button" hidden>Play</button>
  </div>
  </div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="ovTitle">Catch the drips</h2>
      <p id="ovText">Plant the seed, then catch the drips in your thimble to make it grow. Five spills ends the game.</p>
      <section id="board" aria-label="Online high scores" hidden></section>
      <div class="btns"><button id="go" type="button">Start</button><button id="watchBtn" class="ghost" type="button">Just watch</button></div>
      <button id="introBtn" class="link" type="button" hidden>Play with the intro</button>
    </div>
  </div>
  </section>
  <p class="hint" id="hint">Drag anywhere on the scene to move. On a keyboard, use the arrow keys, M to mute and F for full screen.</p>
</main>
<script src="audio.js?v=cd567a2e80"></script>

</body>
