<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: one centered column; HUD row, then a 4:3 pixel stage with its own overlay, then a one-line hint */
:root{--dusk:#2a2140;--dusk-2:#3b2f58;--cream:#f6e7c8;--muted:#b6a6cc;--sun:#f5c32c;--sun-deep:#b8861a;--drop:#7fd0ff;--display:'Silkscreen',ui-monospace,monospace;--body:'Pixelify Sans',system-ui,sans-serif;color-scheme:dark}
html,body{background:var(--dusk);color:var(--cream)}
body{font-family:var(--body);font-size:16px}
main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 28px;display:grid;gap:14px}
.back{justify-self:start;display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.back img{width:20px;height:22px;image-rendering:pixelated}
.back:hover,.back:focus-visible{color:var(--cream)}
.back:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--sun);letter-spacing:.02em}
.hud{display:flex;flex-wrap:wrap;align-items:end;gap:18px}
.stat{display:grid;gap:2px}
.stat span{font-family:var(--display);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stat b{font-weight:600;font-size:20px;line-height:24px;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:4px;height:24px;align-items:center}
.pips i{width:8px;height:10px;background:var(--drop);display:block}
.pips i.gone{background:var(--dusk-2)}
.stage{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px var(--dusk-2)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:ew-resize}
.overlay{display:grid;text-align:center}
.card{display:grid;gap:10px;justify-items:center;background:var(--dusk-2);border-radius:10px;padding:16px 18px 18px}
.card p{max-width:44ch}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.ghost{background:transparent;color:var(--cream);box-shadow:none;border:2px solid var(--cream)}
.ghost:active{transform:none;box-shadow:none}
.corner{position:absolute;top:8px;right:8px;font-size:11px;padding:6px 10px;background:rgba(42,33,64,.85);color:var(--cream);box-shadow:none;border:2px solid var(--dusk-2)}
.corner:active{transform:none;box-shadow:none}
.watching .hud .stat{visibility:hidden}
.watching canvas{cursor:default}
.card h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;color:var(--sun);text-wrap:balance}
.card p{margin:0;line-height:1.4;color:var(--cream)}
button{font-family:var(--display);font-size:14px;background:var(--sun);color:var(--dusk);border:0;border-radius:4px;padding:10px 18px;box-shadow:0 3px 0 var(--sun-deep);cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun-deep)}
button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.hint{margin:0;color:var(--muted);font-size:14px}
.snd{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--cream);box-shadow:none;border:2px solid var(--dusk-2);padding:8px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.snd:active{transform:none;box-shadow:none}
.snd i{display:block;width:8px;height:8px;background:var(--drop)}
.snd[aria-pressed="false"] i{background:var(--dusk-2)}
</style>
</head>
<body>
<main>
  <a class="back" href="../index.html"><img src="../assets/mark-pixel-dark.png" alt="" width="40" height="44">Jonniepeed Games</a>
  <header>
    <h1>Thimbleful</h1>
    <div class="hud">
      <div class="stat"><span>Caught</span><b id="score">0</b></div>
      <div class="stat"><span>Chances</span><div class="pips" id="pips"></div></div>
      <div class="stat"><span>Best</span><b id="best">0</b></div>
      <button class="snd" id="snd" type="button" aria-pressed="true"><i aria-hidden="true"></i><span>Sound on</span></button>
    </div>
  </header>
  <div class="stage">
    <canvas id="c" width="96" height="72" aria-label="A tiny explorer on a windowsill garden at sunset catches drips from a leaking watering can in her thimble"></canvas>
    <button id="skip" class="corner" type="button" hidden>Skip</button>
    <button id="leave" class="corner" type="button" hidden>Play</button>
  </div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="ovTitle">Catch the drips</h2>
      <p id="ovText">Plant the seed, then catch the drips in your thimble to make it grow. Five spills ends the game.</p>
      <div class="btns"><button id="go" type="button">Start</button><button id="watchBtn" class="ghost" type="button">Just watch</button></div>
    </div>
  </div>
  <p class="hint" id="hint">Drag anywhere on the scene to move. On a keyboard, use the arrow keys, and M to mute.</p>
</main>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
